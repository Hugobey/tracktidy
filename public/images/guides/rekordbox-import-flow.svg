<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Clean first, import second</title><desc id="d">Six steps in order: download, fix tags, rename the file, import into rekordbox, check beat grid and cues, export to USB.</desc>
<rect width="1200" height="330" fill="#111318"/>
<style>text{font-family:Inter,Helvetica,Arial,sans-serif;text-anchor:middle}.h{fill:#e8eaf0;font-size:30px;font-weight:700}.n{fill:#e8eaf0;font-size:24px;font-weight:700}.s{fill:#aab1c0;font-size:19px}.k{font-size:20px;font-weight:700}</style>
<text class="h" x="600" y="52">Clean first, import second</text>
<rect x="36" y="110" width="150" height="150" rx="14" fill="#1c2130" stroke="#7c8bf0" stroke-width="2"/>
<text class="k" style="fill:#7c8bf0" x="111.0" y="148">1</text>
<text class="n" x="111.0" y="185">Download</text>
<text class="s" x="111.0" y="218">MP3 files</text>
<text class="s" x="111.0" y="243"></text>
<line x1="192" y1="185" x2="218" y2="185" stroke="#7f8aa3" stroke-width="3"/><polygon points="230,185 216,177 216,193" fill="#7f8aa3"/>
<rect x="234" y="110" width="150" height="150" rx="14" fill="#1c2130" stroke="#9a7be8" stroke-width="2"/>
<text class="k" style="fill:#9a7be8" x="309.0" y="148">2</text>
<text class="n" x="309.0" y="185">Fix tags</text>
<text class="s" x="309.0" y="218">artist, title,</text>
<text class="s" x="309.0" y="243">BPM, key</text>
<line x1="390" y1="185" x2="416" y2="185" stroke="#7f8aa3" stroke-width="3"/><polygon points="428,185 414,177 414,193" fill="#7f8aa3"/>
<rect x="432" y="110" width="150" height="150" rx="14" fill="#1c2130" stroke="#c56fe0" stroke-width="2"/>
<text class="k" style="fill:#c56fe0" x="507.0" y="148">3</text>
<text class="n" x="507.0" y="185">Rename</text>
<text class="s" x="507.0" y="218">Artist - Title</text>
<text class="s" x="507.0" y="243">(BPM) [Key]</text>
<line x1="588" y1="185" x2="614" y2="185" stroke="#7f8aa3" stroke-width="3"/><polygon points="626,185 612,177 612,193" fill="#7f8aa3"/>
<rect x="630" y="110" width="150" height="150" rx="14" fill="#1c2130" stroke="#6fd3b0" stroke-width="2"/>
<text class="k" style="fill:#6fd3b0" x="705.0" y="148">4</text>
<text class="n" x="705.0" y="185">Import</text>
<text class="s" x="705.0" y="218">into rekordbox</text>
<text class="s" x="705.0" y="243">analysis runs</text>
<line x1="786" y1="185" x2="812" y2="185" stroke="#7f8aa3" stroke-width="3"/><polygon points="824,185 810,177 810,193" fill="#7f8aa3"/>
<rect x="828" y="110" width="150" height="150" rx="14" fill="#1c2130" stroke="#e8c46a" stroke-width="2"/>
<text class="k" style="fill:#e8c46a" x="903.0" y="148">5</text>
<text class="n" x="903.0" y="185">Check</text>
<text class="s" x="903.0" y="218">grid and cues</text>
<text class="s" x="903.0" y="243">by ear</text>
<line x1="984" y1="185" x2="1010" y2="185" stroke="#7f8aa3" stroke-width="3"/><polygon points="1022,185 1008,177 1008,193" fill="#7f8aa3"/>
<rect x="1026" y="110" width="150" height="150" rx="14" fill="#1c2130" stroke="#e88a6a" stroke-width="2"/>
<text class="k" style="fill:#e88a6a" x="1101.0" y="148">6</text>
<text class="n" x="1101.0" y="185">Export</text>
<text class="s" x="1101.0" y="218">to the USB</text>
<text class="s" x="1101.0" y="243">stick</text>
<text class="s" x="600" y="305">Steps 2 and 3 happen before step 4, so the library never sees the messy version.</text>
</svg>